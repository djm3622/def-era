device:
  preference: "cuda"
  index: null

paradis_diffusion:
  condition_dropout: 0.1

distributed_training:
  num_processes: 1
  total_batch_size: 64
  workers_per_gpu: 4
  workers: 8
  prefetch_factor: 1
  grad_accumulate: 1
  mixed_precision: "fp16"

optimization:
  base_lr: 3.0e-5
  max_lr: 3.0e-4
  lr: 3.0e-5
  scheduler:
    pct_start: 0.1
    div_factor: 25
    final_div_factor: 10

training_info:
  epochs: 1
  validation_delay: 10
  validation_batches: 0
  patience: 10

experiment:
  project_name: "DEF"
  experiment_name: "paradis-diffusion-5deg-h100-benchmark-1epoch"
  save_path: "${oc.env:SCRATCH,/scratch/dmillard}/def-era/outputs/paradis-diffusion-5deg-h100-benchmark-1epoch/"
  from_checkpoint: null
  from_state: null

sampling:
  enabled: false
  interval: 5
  num_samples: 4
  num_steps: 50
  guidance_scale: 0.7
  eta: 0.0
  corrector: true
  seed: 1000
  save_dir: "samples"

dataset:
  root_dir: "${oc.env:SCRATCH,/scratch/dmillard}/def-era/ERA5/5.65deg"
  time_resolution: 6h
  forecast_steps: 1
  timestep: 1000
  beta_start: 1.0e-4
  beta_end: 0.02
  validate_nan: false

training:
  seed: 100
  gamma: 0.99

  dataset:
    start_date: 1960-01-01
    end_date: 2014-12-31

  validation_dataset:
    start_date: 2015-01-01
    end_date: 2023-01-10

  variable_loss_weights:
    atmospheric:
      wind_x: 1.0
      wind_y: 1.0
      wind_z: 1.0
      geopotential: 1.0
      specific_humidity: 1.0
      temperature: 1.0
      vertical_velocity: 1.0
    surface:
      wind_x_10m: 1.0
      wind_y_10m: 1.0
      wind_z_10m: 1.0
      2m_temperature: 1.0
      mean_sea_level_pressure: 1.0
      surface_pressure: 1.0
      total_column_water: 1.0

paradis:
  compute:
    compile: false
    gradient_checkpointing: false

  model:
    latent_size: 256
    forecast_steps: 1
    base_dt: 21600
    num_layers: 4
    bias_channels: 10
    velocity_vectors: 8
    adv_interpolation: bilinear
    downsample_diffusion: false
    latent_size_static: 32
    activation: SiLU

    physblock:
      input_proj:
        layers:
          - CLinear
        hidden_dim: ${paradis.model.latent_size}
      velocity_net:
        layers:
          - CLinear
        hidden_dim: ${paradis.model.latent_size}
      diffusion:
        layers:
          - SepConv
        hidden_dim: ${paradis.model.latent_size}
      reaction:
        layers:
          - CLinear
          - CLinear
        hidden_dim: ${paradis.model.latent_size}
      output_proj:
        layers:
          - SepConv
          - SepConv
        hidden_dim: ${paradis.model.latent_size}
      advection:
        down_projection:
          layers:
            - SepConv
          hidden_dim: ${paradis.model.latent_size}
        up_projection:
          layers:
            - SepConv
          hidden_dim: ${paradis.model.latent_size}

features:
  pressure_levels:
    - 50
    - 100
    - 150
    - 200
    - 250
    - 300
    - 400
    - 500
    - 600
    - 700
    - 850
    - 925
    - 1000

  base:
    atmospheric:
      - geopotential
      - wind_x
      - wind_y
      - wind_z
      - specific_humidity
      - temperature
      - vertical_velocity
    surface:
      - wind_x_10m
      - wind_y_10m
      - wind_z_10m
      - 2m_temperature
      - mean_sea_level_pressure
      - surface_pressure
      - total_column_water

  input:
    atmospheric: ${features.base.atmospheric}
    surface: ${features.base.surface}
    forcings: []
    constants:
      - geopotential_at_surface
      - land_sea_mask
      - slope_of_sub_gridscale_orography
      - standard_deviation_of_orography
      - lon_spacing
      - cos_latitude
      - cos_longitude
      - sin_longitude
      - latitude
      - longitude

  output:
    atmospheric: ${features.base.atmospheric}
    surface: ${features.base.surface}

hydra:
  run:
    dir: ${oc.env:SCRATCH,/scratch/dmillard}/def-era/hydra/run
  sweep:
    dir: ${oc.env:SCRATCH,/scratch/dmillard}/def-era/hydra_sweeps
    subdir: job
